access_notes: Canva site that renders client-side; read the visible text in a headless browser. Without a browser, a plain fetch embeds the whole Canva document in window['bootstrap']; the shown homepage is the one page named "Home" not flagged hidden ("R":false), and on 2026-10-17 its text matched the 2026-10-13 browser read word for word. The page bundle still embeds hidden Galveston-era pages (Hilton Galveston hotel block, Galveston Island Convention Center) that are not shown on screen.
