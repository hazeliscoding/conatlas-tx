name: Deploy

# Publishes the site to Vercel: after CI passes on main, every morning (the site decides what is
# "upcoming" from the build date, so it must rebuild daily), and on demand. The site is built
# here and uploaded prebuilt, so Vercel never builds from Git (vercel.json turns that off).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 11 * * *' # 11:17 UTC, early morning in Texas
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Runs the repository's code and its dependencies, so it gets no secrets.
  build:
    # Only main deploys (a manual run can pick any branch). workflow_run's branch filter matches a
    # fork's branch of the same name too, so only a successful CI run for a push to this
    # repository may deploy.
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name != 'workflow_run' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # After CI, deploy exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:validate
      - run: npm install --global vercel@60.1.3
      # `vercel build` needs a project file but no link: vercel.json holds every setting.
      - run: |
          mkdir -p .vercel
          echo '{"projectId":"unlinked","orgId":"unlinked","settings":{}}' > .vercel/project.json
      - run: vercel build --prod
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-output
          path: .vercel/output
          include-hidden-files: true
          retention-days: 1

  # Holds the token and runs no repository code: it uploads the built files as they are. The
  # secrets belong to the production environment, which only main may deploy to.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://conatlas-tx.vercel.app/
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vercel-output
          path: .vercel/output
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global vercel@60.1.3
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
