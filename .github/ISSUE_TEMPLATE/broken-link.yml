name: Fix an official link
description: An official website, ticket or source link that's broken or points to the wrong page.
title: '[Link]: '
labels: ['broken link']
body:
  - type: markdown
    attributes:
      value: |
        ConAtlas only publishes facts from **official sources**: the organizer's website, an organizer announcement, an organizer feed, or the organizer's own social account. Third-party listings and fan wikis are welcome as leads, but they can't back a listing. More in the [data policy](https://github.com/hazeliscoding/conatlas-tx/blob/main/docs/DATA_POLICY.md).

        A maintainer checks every report against the organizer before anything changes on the site. This issue is public, so please don't include private information.
  - type: input
    id: convention
    attributes:
      label: Convention and edition
      placeholder: e.g. San Japan 2027
    validations:
      required: true
  - type: dropdown
    id: link
    attributes:
      label: Which link
      options:
        - Official website
        - Tickets
        - A source in the verification panel
        - Something else
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: The link that's wrong or broken
      placeholder: https://
    validations:
      required: true
  - type: input
    id: replacement
    attributes:
      label: The correct link, if you know it
      placeholder: https://
  - type: textarea
    id: notes
    attributes:
      label: Anything else
